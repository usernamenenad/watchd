services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: watchd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=postgres --dbname=watchd"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./testing/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

volumes:
  postgres-data:

