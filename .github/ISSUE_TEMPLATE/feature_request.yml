name: Feature proposal
description: Propose a scoped capability or contract change
title: "Proposal: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or operator problem without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: correctness
    attributes:
      label: Correctness and failure behavior
      description: What must remain true during disconnects, restarts, retries, and partial failure?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: done
    attributes:
      label: Definition of done
    validations:
      required: true
