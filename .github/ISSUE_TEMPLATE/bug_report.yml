name: Bug report
description: Report reproducible incorrect watchd behavior
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities here. Follow SECURITY.md for private reporting.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence of steps. Redact credentials and row data.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: watchd version or commit
    validations:
      required: true
  - type: input
    id: postgres
    attributes:
      label: PostgreSQL version and deployment
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Correctness and operational impact
      description: Note stale data, gaps, duplicates, resyncs, crashes, or resource growth.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant redacted logs
      render: text
